<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for static hosts (e.g. GitHub Pages) that serve 404.html
      // Preserve the requested path so React Router can handle it after redirect.
      var path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace("/?spa_redirect=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
